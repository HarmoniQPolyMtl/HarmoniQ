[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harmoniq"
version = "0.1.0"
description = "Librarie pour l'analyse de production d'énergie de Hydro-Québec"
requires-python = ">=3.8"
authors = [
    {name = "Sébastien Dasys", email = "sebastien.dasys@polymtl.ca"},
    {name = "Alec Mitchell", email = "alec.mitchell@polymtl.ca"},
    # Ajoute ton nom si tu contribues au code
]
dependencies = [
    # Général
    "numpy==1.26.4",
    "urllib3==1.26.6",
    "pandas",
    "pandera",
    "matplotlib",
    "scipy",
    "openpyxl",
    "scipy",
    "openpyxl",
    "isodate",
    # Web app dependencies
    "flask",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "python-dotenv",
    "email-validator",
    # Ajoute les dépendances nécessaires au fur et à mesure
    # solaire dependencies
    "pvlib",
    # hydro dependencies
    "HydroGenerate",
    "nrel-pysam",
    "windpowerlib",
    "geopandas",
    "env-canada",
    "pypsa",
    "pypsa[hdf5]",
    "pyarrow",
    "fastparquet",
    "xarray",
    "cdsapi",
    "netCDF4",
    "openmeteo-requests",
    "requests-cache",
    "retry-requests",
    "psycopg2"
]

[project.scripts]
init-db = "harmoniq.scripts.init_database:main"
load-db = "harmoniq.scripts.load_database:main"
launch-app = "harmoniq.scripts.lance_webserver:main"
migrate-weibull = "harmoniq.scripts.eolien.migrate_add_weibull_columns:main"
migrate-weibull-v2 = "harmoniq.scripts.eolien.migrate_add_weibull_v2_columns:main"
backfill-weibull = "harmoniq.scripts.eolien.backfill_weibull_eolien:main"
fetch-era5-qc-2024 = "harmoniq.scripts.eolien.fetch_era5_quebec_2024:main"
select-wind-sites-2035 = "harmoniq.scripts.eolien.select_wind_sites_2035:main"
migrate-offshore-mesh = "harmoniq.scripts.eolien.migrate_add_offshore_mesh_schema:main"
build-offshore-mesh = "harmoniq.scripts.eolien.build_quebec_offshore_mesh:main"
backfill-offshore-eolien = "harmoniq.scripts.eolien.backfill_offshore_eolien:main"

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "pytest",
    "pytest-cov",
    "httpx",
    "gdown"
]

[tool.setuptools]
packages = ["harmoniq"]

[tool.coverage.run]
source = ["harmoniq"]
omit = ["harmoniq/scripts/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
markers = [
    "integration: tests appelant des APIs externes (PVGIS, etc.) — nécessite internet",
    "performance: tests de performance longs — sautés par défaut sauf si --perf est passé",
    "resources: tests de limites de ressources (RAM, disque)",
]
